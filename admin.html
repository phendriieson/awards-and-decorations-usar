<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>USASOC Admin Terminal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="command-header">
    <div class="brand-text">
      <h1>USASOC Command Administration Terminal</h1>
      <p>DATABASE EDIT & LOG UPDATE PORTAL</p>
    </div>
  </header>

  <!-- Login Form -->
  <div id="login-container" style="max-width: 400px; margin: 50px auto;" class="panel-box">
    <div class="panel-header">Admin Authentication</div>
    <form onsubmit="event.preventDefault(); handleLogin();">
      <div class="editor-form">
        <label>Admin Email</label>
        <input type="email" id="admin-email" required>
        <label>Password</label>
        <input type="password" id="admin-password" required>
        <button type="submit" class="btn-usasoc" style="width:100%;">Authenticate</button>
      </div>
    </form>
  </div>

  <!-- Admin Control Panel -->
  <div id="editor-container" class="admin-split-container" style="display:none;">
    <div class="panel-box">
      <div class="panel-header">Update Record & Add Logs</div>
      <form class="editor-form" onsubmit="event.preventDefault(); saveToDatabase();">
        <label>Select Record</label>
        <select id="edit-award-select" onchange="loadSelectedAward()"></select>

        <label>Status</label>
        <select id="edit-status">
          <option value="Obtained">Obtained</option>
          <option value="Unobtained">Unobtained</option>
        </select>

        <label>Date Awarded</label>
        <input type="text" id="edit-date" placeholder="YYYY-MM-DD">

        <label>Evidence Log / Mission Notes</label>
        <textarea id="edit-evidence" rows="6" placeholder="Enter official log details or proof..."></textarea>

        <button type="submit" class="btn-usasoc" style="width:100%;">Save to Cloud Database</button>
      </form>
    </div>

    <div class="panel-box">
      <div class="panel-header">Live Database Overview</div>
      <div class="awards-grid" id="preview-grid" style="max-height: 500px; overflow-y: auto;"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
</body>
</html>
