<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>USASOC Admin Terminal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="command-header">
    <div class="brand-text">
      <h1>USASOC Personnel Command Editor</h1>
      <p>SECURE EDITOR // DATABASE SYNC ENGINE</p>
    </div>
  </header>

  <!-- LOGIN BOX -->
  <div id="login-container" style="max-width: 400px; margin: 50px auto;" class="panel-box">
    <div class="panel-header">Admin Authentication</div>
    <form onsubmit="event.preventDefault(); handleLogin();">
      <label>Admin Email</label>
      <input type="email" id="admin-email" required style="width:100%; padding:10px; margin-bottom:15px; background:#000; color:#fff; border:1px solid #2D3A30;">
      <label>Password</label>
      <input type="password" id="admin-password" required style="width:100%; padding:10px; margin-bottom:15px; background:#000; color:#fff; border:1px solid #2D3A30;">
      <button type="submit" class="btn-usasoc" style="width:100%;">Authenticate</button>
    </form>
  </div>

  <!-- EDITOR INTERFACE (Hidden until logged in) -->
  <div id="editor-container" class="admin-split-container" style="display:none;">
    <div class="panel-box">
      <div class="panel-header">Update Cloud Record</div>
      <form class="editor-form" onsubmit="event.preventDefault(); saveToDatabase();">
        <label>Select Decoration/Award</label>
        <select id="edit-award-select" onchange="loadSelectedAward()"></select>

        <label>Status</label>
        <select id="edit-status">
          <option value="Obtained">Obtained</option>
          <option value="Unobtained">Unobtained</option>
        </select>

        <label>Date Awarded</label>
        <input type="text" id="edit-date" placeholder="YYYY-MM-DD">

        <label>Evidence Log / Notes</label>
        <textarea id="edit-evidence" rows="4"></textarea>

        <button type="submit" class="btn-usasoc">Save Permanently to Cloud</button>
      </form>
    </div>

    <div class="panel-box">
      <div class="panel-header">Live Terminal Preview</div>
      <div class="awards-grid" id="preview-grid" style="max-height: 500px; overflow-y: auto;"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
</body>
</html>
